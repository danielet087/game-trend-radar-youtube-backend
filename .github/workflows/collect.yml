name: Collect YouTube live data

# Collection remains paused: enable a schedule only after configuring Secrets.
# CI tests run separately and do not call the live API.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-live-publish
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check collection credentials
        id: credentials
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -n "$YOUTUBE_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo '::notice::Missing YouTube credentials; collection skipped.'
            echo '### YouTube: 尚未設定 Secrets，本次未收集、未發布。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v5
        if: steps.credentials.outputs.configured == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        if: steps.credentials.outputs.configured == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run offline tests
        if: steps.credentials.outputs.configured == 'true'
        run: python -m pytest -q
      - name: Collect YouTube
        if: steps.credentials.outputs.configured == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m scripts.update_youtube --search-calls 2 --output output/youtube_live.json
      - name: Validate JSON
        if: steps.credentials.outputs.configured == 'true'
        run: python -m json.tool output/youtube_live.json > /dev/null
      - name: Preserve collected JSON
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-live-json
          path: output/youtube_live.json
          if-no-files-found: error
          retention-days: 2
      - name: Publish to frontend
        if: steps.credentials.outputs.configured == 'true'
        env:
          FRONTEND_REPO_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: |
          if [ -z "$FRONTEND_REPO_TOKEN" ]; then
            echo '::notice::FRONTEND_REPO_TOKEN is not configured; JSON is available in the artifact only.'
            echo '### YouTube: 已收集，未發布；請設定 FRONTEND_REPO_TOKEN。' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bash scripts/publish_frontend.sh output/youtube_live.json
          echo '### YouTube: 已收集並發布 data/youtube_live.json。' >> "$GITHUB_STEP_SUMMARY"
      - name: Report failure
        if: failure()
        run: |
          echo '### YouTube: 本次失敗，請檢查失敗步驟；未發布的結果不會冒充更新完成。' >> "$GITHUB_STEP_SUMMARY"
